<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img">
<title>REELIX video categories</title>
<desc>Format, then style, then look. Explainer teaches with Chalkboard diagrams or a 3D world; Animated tells a story with 2D pictures or 3D.</desc>
<style>
  .bg{fill:#ffffff}
  .q{font-size:14px;font-weight:600;fill:#1f2328}
  .n{font-size:15px;font-weight:600}
  .d{font-size:13px}
  .note{font-size:13px;fill:#3d444d}
  .l{stroke:#8c959f;stroke-width:1.5;fill:none}
  @media (prefers-color-scheme: dark){.bg{fill:#0d1117}.q{fill:#f0f6fc}.note{fill:#b7bdc8}.l{stroke:#6e7681}}
</style>
<rect class="bg" width="900" height="400"/>

<rect x="360" y="14" width="180" height="36" rx="8" fill="#1f2328" stroke="#1f2328" stroke-width="2"/>
<text class="n" x="450" y="37" text-anchor="middle" fill="#ffffff">reelix &lt;name&gt;</text>

<text class="q" x="450" y="70" text-anchor="middle">1 · Short or Video?   ·   2 · Which style?</text>
<path class="l" d="M450 50v30M230 80h440M230 80v18M670 80v18"/>

<rect x="130" y="98" width="200" height="46" rx="10" fill="#ffe8f0" stroke="#bf3b67" stroke-width="2"/>
<text class="n" x="230" y="118" text-anchor="middle" fill="#8c1d42">Explainer / Tutorial</text>
<text class="d" x="230" y="136" text-anchor="middle" fill="#a62a52">teach a thing</text>
<rect x="570" y="98" width="200" height="46" rx="10" fill="#ffe8f0" stroke="#bf3b67" stroke-width="2"/>
<text class="n" x="670" y="118" text-anchor="middle" fill="#8c1d42">Animated / Motion</text>
<text class="d" x="670" y="136" text-anchor="middle" fill="#a62a52">tell a story</text>

<text class="q" x="450" y="170" text-anchor="middle">3 · Which look?</text>
<path class="l" d="M230 144v34M110 178h240M110 178v18M350 178v18"/>
<path class="l" d="M670 144v34M550 178h240M550 178v18M790 178v18"/>

<rect x="35" y="196" width="150" height="26" rx="6" fill="#fff1cc" stroke="#b07000" stroke-width="2" stroke-dasharray="5 3"/>
<text class="d" x="110" y="214" text-anchor="middle" font-weight="600" fill="#7a4d00">Diagrams</text>
<rect x="275" y="196" width="150" height="26" rx="6" fill="#ede9ff" stroke="#6b4fd8" stroke-width="2"/>
<text class="d" x="350" y="214" text-anchor="middle" font-weight="600" fill="#4435a6">3D</text>
<rect x="475" y="196" width="150" height="26" rx="6" fill="#ddeeff" stroke="#1f6feb" stroke-width="2"/>
<text class="d" x="550" y="214" text-anchor="middle" font-weight="600" fill="#0a4a9e">2D</text>
<rect x="715" y="196" width="150" height="26" rx="6" fill="#ede9ff" stroke="#6b4fd8" stroke-width="2"/>
<text class="d" x="790" y="214" text-anchor="middle" font-weight="600" fill="#4435a6">3D</text>

<path class="l" d="M110 222v18M350 222v18M550 222v18M790 222v18"/>

<rect x="30" y="240" width="160" height="50" rx="10" fill="#fff1cc" stroke="#b07000" stroke-width="2" stroke-dasharray="5 3"/>
<text class="n" x="110" y="260" text-anchor="middle" fill="#7a4d00">Chalkboard</text>
<text class="d" x="110" y="279" text-anchor="middle" fill="#8a5a00">flat or 3D per shot</text>
<text class="d" x="110" y="306" text-anchor="middle" font-weight="600" fill="#8a5a00">planned next</text>

<rect x="270" y="240" width="160" height="30" rx="8" fill="#6b4fd8" stroke="#6b4fd8" stroke-width="2"/>
<text class="d" x="350" y="259" text-anchor="middle" font-weight="600" fill="#ffffff">Lego world · V5</text>
<rect x="270" y="278" width="160" height="30" rx="8" fill="#ede9ff" stroke="#6b4fd8" stroke-width="2"/>
<text class="d" x="350" y="297" text-anchor="middle" fill="#4435a6">AI motion · V4</text>

<rect x="470" y="240" width="160" height="30" rx="8" fill="#1f6feb" stroke="#1f6feb" stroke-width="2"/>
<text class="d" x="550" y="259" text-anchor="middle" font-weight="600" fill="#ffffff">Realistic painting</text>
<rect x="470" y="278" width="160" height="30" rx="8" fill="#ddeeff" stroke="#1f6feb" stroke-width="2"/>
<text class="d" x="550" y="297" text-anchor="middle" fill="#0a4a9e">Cartoon</text>

<rect x="710" y="240" width="160" height="30" rx="8" fill="#6b4fd8" stroke="#6b4fd8" stroke-width="2"/>
<text class="d" x="790" y="259" text-anchor="middle" font-weight="600" fill="#ffffff">AI motion · V4</text>
<rect x="710" y="278" width="160" height="30" rx="8" fill="#ede9ff" stroke="#6b4fd8" stroke-width="2"/>
<text class="d" x="790" y="297" text-anchor="middle" fill="#4435a6">Lego world · V5</text>

<text class="note" x="450" y="342" text-anchor="middle">Filled box = the look made for that style (press Enter to take it) · dashed = planned next</text>
<text class="note" x="450" y="362" text-anchor="middle">Until Chalkboard is built, Explainer goes straight to the 3D looks: 4 questions, not 5</text>
<text class="note" x="450" y="382" text-anchor="middle">Every look works for both Shorts and long videos</text>
</svg>
